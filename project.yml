name: CottageConnect
options:
  bundleIdPrefix: org.cottageconnect
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
targets:
  CottageConnect:
    type: application
    supportedDestinations: [iOS, macOS]
    scheme: {}
    sources: [CottageConnect]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.cottageconnect.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.9"
